name: Refresh profile artwork

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render public contribution data
        run: node scripts/generate_profile.mjs
      - name: Verify calendar handling and SVG layout
        run: node --test tests/test_profile.mjs
      - name: Save updated artwork
        run: |
          git add assets data/contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh profile activity'
          git push
